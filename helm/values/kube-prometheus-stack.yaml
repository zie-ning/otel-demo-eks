# kube-prometheus-stack 차트 values (차트 버전은 scripts/deploy-observability.ps1에서 고정)
# Phase 3-B ③: Prometheus·Alertmanager·operator·node-exporter·kube-state-metrics 설치.
# Grafana는 ④에서 켠다. 차트 내장 Prometheus와 병행 운영하며 Collector가 양쪽에 같은 메트릭을 보낸다.
#
# 자원 원칙: monitoring 노드(m7i-flex.large, 할당 가능 CPU 1930m)는 이미 CPU requests 82%가 예약되어 있다.
# 스케줄링은 실제 사용량이 아니라 requests 합으로 판단하므로 requests는 실제 필요량에 가깝게 작게 잡는다.

# 리소스 이름 접두사를 짧게 (서비스: kps-prometheus, kps-alertmanager, kps-operator)
fullnameOverride: kps

# 관측 도구는 monitoring 노드그룹 전용 taint를 견디고 그 노드로만 간다 (otel-demo.yaml과 같은 규칙)
x-monitoringNode: &monitoringNode
  nodeSelector:
    role: monitoring
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

# EKS는 컨트롤 플레인을 AWS가 운영해 controller-manager, scheduler, etcd에 접근할 수 없다.
# kube-proxy는 메트릭을 127.0.0.1에만 열어 수집할 수 없다. 켜 두면 수집 실패와 거짓 알림만 생긴다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

# Phase 3-B ④: 데모 차트 내장 Grafana를 대신한다.
# 데모 대시보드·알림은 helm/grafana(kustomize)가 ConfigMap으로 만들고 사이드카가 읽는다.
grafana:
  enabled: true
  <<: *monitoringNode
  # admin 계정은 deploy-observability.ps1이 만드는 Secret을 쓴다 (비밀번호는 Git에 남기지 않음)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    # frontend-proxy(Envoy)가 /grafana 경로를 경로 그대로 넘기므로 하위 경로로 서비스한다
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      serve_from_sub_path: true
    # 내장 Grafana는 익명 Admin이었다. 익명은 읽기 전용으로 낮추고 편집은 admin 로그인으로 한다.
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  sidecar:
    # 대시보드를 ConfigMap 주석(grafana_folder) 값의 폴더에 넣는다.
    # kps 기본 대시보드는 아래 annotations로 "Kubernetes", 데모 대시보드는 helm/grafana/kustomization.yaml에서 "OpenTelemetry Demo"
    dashboards:
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Kubernetes
      provider:
        foldersFromFilesStructure: true
    # 대시보드·데이터소스·알림 사이드카 공통
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
    datasources:
      # 데모 대시보드·알림이 참조하는 uid로 맞춘다. kps 기본 대시보드는 데이터소스 변수를 쓰므로 영향 없음
      uid: webstore-metrics
      # 데모 SDK 메트릭 전송 주기(60초)에 맞춘다 (내장 Grafana 설정과 동일)
      defaultDatasourceScrapeInterval: 60s
      exemplarTraceIdDestinations:
        datasourceUid: webstore-traces
        traceIdLabelName: trace_id
      # Alertmanager 데이터소스는 이 Grafana 버전에서 "Plugin unavailable"로 동작하지 않는다.
      # Grafana 알림은 contact point(helm/grafana/alerting/contact-points.yml)로 Alertmanager에 보낸다.
      alertmanager:
        enabled: false
  # serve_from_sub_path 때문에 /metrics는 localhost:3000/grafana/metrics로 리다이렉트되어 수집이 실패한다
  serviceMonitor:
    path: /grafana/metrics
  # 트레이스는 Tempo(⑤), 로그는 Loki(⑥)
  additionalDataSources:
    # 데모 대시보드·exemplar 링크가 참조하는 uid(webstore-traces)를 Jaeger에서 넘겨받는다
    - name: Tempo
      uid: webstore-traces
      type: tempo
      url: http://tempo.monitoring:3200
      editable: true
      jsonData:
        # 트레이스 → 로그: 스팬의 trace_id·span_id로 Loki 로그를 찾는다 (⑦에서 동작 확인)
        tracesToLogsV2:
          datasourceUid: webstore-logs
          spanStartTimeShift: "-20m"
          spanEndTimeShift: "20m"
          customQuery: true
          # trace_id·span_id는 Loki 구조화 메타데이터라 라벨 셀렉터가 아니라 파이프라인 필터로 건다.
          # LogQL은 빈 값과 일치하지 않는 라벨 조건이 하나 이상 필요해 service_name=~".+"를 둔다.
          # Grafana 프로비저닝 파일은 ${...}를 환경변수로 치환하므로 $$로 이스케이프한다
          query: '{service_name=~".+"} | trace_id="$${__trace.traceId}" | span_id="$${__span.spanId}"'
        # 트레이스 → 지표: 스팬의 서비스로 Collector span metrics(RED) 그래프를 연다 (⑦).
        # $__tags는 아래 tags 매핑(service.name → service_name 라벨)으로 치환된다.
        # span metrics는 1분마다 한 번 들어오므로 rate 구간은 5m (1m이면 점이 하나뿐이라 결과가 비어 있음)
        tracesToMetrics:
          datasourceUid: webstore-metrics
          spanStartTimeShift: "-10m"
          spanEndTimeShift: "10m"
          tags:
            - key: service.name
              value: service_name
          queries:
            - name: 요청률
              query: sum by (span_name) (rate(traces_span_metrics_calls_total{$$__tags}[5m]))
            - name: 에러율
              query: sum by (span_name) (rate(traces_span_metrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
            - name: p95 지연(ms)
              query: histogram_quantile(0.95, sum by (le, span_name) (rate(traces_span_metrics_duration_milliseconds_bucket{$$__tags}[5m])))
        # 서비스 맵(데모 대시보드의 Service Dependency)은 Tempo metrics-generator가 Prometheus에 쓴
        # traces_service_graph_* 지표로 그린다 (Jaeger의 dependencyGraph를 대신함)
        serviceMap:
          datasourceUid: webstore-metrics
        nodeGraph:
          enabled: true
    # 데모 대시보드가 참조하는 uid(webstore-logs)를 OpenSearch에서 넘겨받는다
    - name: Loki
      uid: webstore-logs
      type: loki
      url: http://loki.monitoring:3100
      editable: true
      jsonData:
        # 로그 → 트레이스: OTLP 로그의 trace_id(구조화 메타데이터)를 Tempo 링크로 표시한다 (⑦).
        # matcherType label은 라벨과 구조화 메타데이터를 모두 찾는다
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: webstore-traces
            url: $${__value.raw}
            urlDisplayLabel: Tempo에서 트레이스 보기

prometheusOperator:
  <<: *monitoringNode
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  admissionWebhooks:
    patch:
      <<: *monitoringNode
  # Prometheus·Alertmanager 파드에 붙는 설정 리로더 사이드카
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi

prometheus:
  prometheusSpec:
    <<: *monitoringNode
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    # 클러스터를 작업할 때만 띄우므로 짧게. 저장소는 emptyDir(차트 기본, storageSpec 미지정)
    retention: 2d

    # 차트 내장 Prometheus와 같은 OTLP·exemplar 설정 (메트릭 이름·라벨이 같아야 대시보드가 그대로 동작한다)
    enableOTLPReceiver: true
    # Tempo metrics-generator가 서비스 그래프 지표를 remote write로 보낸다 (⑤)
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
    tsdb:
      outOfOrderTimeWindow: 30m
    otlp:
      keepIdentifyingResourceAttributes: true
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - container.name
        - host.name
        - postgresql.database.name
        - postgresql.schema.name
        - postgresql.table.name
        - postgresql.index.name

    # 차트 릴리스 라벨이 없는 ServiceMonitor·PrometheusRule도 수집한다 (Phase 4 SLO 규칙을 별도 파일로 둘 예정)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    <<: *monitoringNode
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

kube-state-metrics:
  <<: *monitoringNode
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# 노드는 모두 리눅스(AL2023)라 AIX·macOS용 대시보드와 규칙은 만들지 않는다
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

# DaemonSet이라 모든 노드(monitoring 포함)에 떠야 한다. toleration만 준다.
prometheus-node-exporter:
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
