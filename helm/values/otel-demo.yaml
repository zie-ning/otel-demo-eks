# opentelemetry-demo 차트 values (차트 버전은 scripts/deploy-demo.ps1에서 고정)
# Phase 2: 차트 기본 관측 스택(Jaeger, Prometheus, Grafana, OpenSearch)을 그대로 쓰되,
# 앱과 관측 도구가 서로 다른 노드그룹에 배치되도록 스케줄링 규칙만 지정한다.

# 데모 서비스는 모두 app 노드그룹에 배치
default:
  schedulingRules:
    nodeSelector:
      role: app

components:
  # 브라우저 텔레메트리 전송 주소. 차트 기본값(http://localhost:8080/...)은 port-forward 접속용이라
  # ALB로 접속한 브라우저에서는 실패한다. 상대 경로로 두면 접속한 주소의 frontend-proxy를 거쳐 Collector로 간다.
  frontend:
    envOverrides:
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: /otlp-http/v1/traces

  # 외부 진입점. AWS Load Balancer Controller가 이 Ingress를 보고 ALB를 만든다.
  # 접근 허용 IP(inbound-cidrs)는 커밋하지 않도록 배포 스크립트가 따로 주입한다.
  frontend-proxy:
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        # 노드를 거치지 않고 파드 IP로 바로 전달
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/healthcheck-path: /
      hosts:
        - host: ""
          paths:
            - path: /
              pathType: Prefix
              port: 8080

# 차트 기본값이 DaemonSet 모드라 노드마다 하나씩 떠야 한다.
# 모니터링 노드에도 뜨도록 toleration만 추가한다 (nodeSelector는 지정하지 않음).
opentelemetry-collector:
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

# 관측 도구는 monitoring 노드그룹 전용 taint를 견디고 그 노드로만 간다.
# 같은 규칙을 아래 하위 차트에서 YAML 앵커로 재사용한다.
jaeger:
  jaeger: &monitoringNode
    nodeSelector:
      role: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

prometheus:
  server:
    <<: *monitoringNode

grafana:
  <<: *monitoringNode

opensearch:
  <<: *monitoringNode
