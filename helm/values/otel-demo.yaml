# opentelemetry-demo 차트 values (차트 버전은 scripts/deploy-demo.ps1에서 고정)
# 앱과 관측 도구가 서로 다른 노드그룹에 배치되도록 스케줄링 규칙을 지정한다.
# 차트 내장 관측 도구 중 Prometheus·Grafana는 kube-prometheus-stack으로 대체해 끄고(Phase 3-B ④),
# Jaeger·OpenSearch는 Tempo·Loki로 바꿀 때까지(⑤⑥) 유지한다.

# 데모 서비스는 모두 app 노드그룹에 배치
default:
  schedulingRules:
    nodeSelector:
      role: app

components:
  # 브라우저 텔레메트리 전송 주소. 차트 기본값(http://localhost:8080/...)은 port-forward 접속용이라
  # ALB로 접속한 브라우저에서는 실패한다. 상대 경로로 두면 접속한 주소의 frontend-proxy를 거쳐 Collector로 간다.
  frontend:
    envOverrides:
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: /otlp-http/v1/traces

  # 외부 진입점. AWS Load Balancer Controller가 이 Ingress를 보고 ALB를 만든다.
  # 접근 허용 IP(inbound-cidrs)는 커밋하지 않도록 배포 스크립트가 따로 주입한다.
  frontend-proxy:
    # /grafana 경로를 kube-prometheus-stack의 Grafana로 보낸다 (Phase 3-B ④, 내장 Grafana 비활성화)
    envOverrides:
      - name: GRAFANA_HOST
        value: kube-prometheus-stack-grafana.monitoring.svc.cluster.local
      - name: GRAFANA_PORT
        value: "80"
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        # 노드를 거치지 않고 파드 IP로 바로 전달
        alb.ingress.kubernetes.io/target-type: ip
        # 헬스체크는 Envoy 관리 포트의 /ready로 보낸다 (이슈 #4).
        # 서비스 포트(8080)의 / 로 보내면 Envoy가 frontend까지 트레이싱해 15초마다 트레이스가 쌓인다.
        # 관리 포트 요청은 트레이싱·액세스 로그 경로를 거치지 않는다.
        alb.ingress.kubernetes.io/healthcheck-port: "10000"
        alb.ingress.kubernetes.io/healthcheck-path: /ready
      hosts:
        - host: ""
          paths:
            - path: /
              pathType: Prefix
              port: 8080

# 차트 기본값이 DaemonSet 모드라 노드마다 하나씩 떠야 한다.
# 모니터링 노드에도 뜨도록 toleration만 추가한다 (nodeSelector는 지정하지 않음).
opentelemetry-collector:
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

  # 차트 기본 설정 위에 덮어쓴다. 목록(배열)은 병합되지 않고 통째로 바뀌므로 기존 항목도 다시 적는다.
  config:
    exporters:
      # kube-prometheus-stack의 Prometheus (monitoring 네임스페이스).
      # ③에서 내장 Prometheus와 병행 전송해 같은 결과를 확인했고, ④에서 이쪽으로 일원화했다.
      otlp_http/kps:
        endpoint: http://kps-prometheus.monitoring:9090/api/v1/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
    processors:
      # OBS-2 (#2): cart(.NET), accounting(.NET), quote(PHP) SDK가 보내는 container.id는 실제 컨테이너가 아니라
      # 파드 샌드박스 ID다. containerd + cgroup v2 환경이라 /proc/self/cgroup에 ID가 없어서
      # mountinfo의 /etc/hostname 경로(.../sandboxes/<ID>/hostname)를 읽는다.
      # k8s_attributes는 값이 있는 첫 매칭 규칙(container.id) 하나로만 파드를 찾고, 이 값으로는 파드가 없어
      # 메타데이터 없이 통과한다. 그래서 매칭 전에 지운다. profiles 파이프라인(eBPF 프로파일러가 보내는 올바른 값)에는 넣지 않는다.
      # 앱이 보낸 데이터(service.name 있음)만 지운다. k8s_cluster 등 수신기가 만든 올바른 container.id는 유지한다.
      transform/drop_sdk_container_id:
        error_mode: ignore
        trace_statements: &dropSdkContainerIdStatements
          - context: resource
            statements:
              - delete_key(attributes, "container.id") where attributes["service.name"] != nil
        metric_statements: *dropSdkContainerIdStatements
        log_statements: *dropSdkContainerIdStatements
      k8s_attributes:
        extract:
          # 차트 기본 목록에 container.id만 추가: 쿠버네티스 API의 올바른 컨테이너 ID를 채운다
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - container.id
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
        # pod_association은 바꾸지 않는다. 차트가 profiles 파이프라인용으로 container.id 규칙을 맨 앞에 강제로 넣고,
        # k8s_attributes는 값이 있는 첫 규칙 하나로만 찾는다. 앱 데이터는 위 transform에서 container.id를 지웠으므로
        # 이 규칙을 건너뛰고 다음 규칙(연결 IP)으로 파드를 찾는다.
      # OBS-1 (#1): system 감지기가 host.name을 Collector 파드 이름으로 덮어써서 뺀다.
      resource_detection:
        detectors: [env]
      resource:
        attributes:
          # 차트 기본값 유지
          - key: service.instance.id
            from_attribute: k8s.pod.uid
            action: insert
          # host.name은 실제 실행 노드 이름으로 통일한다 (DaemonSet이라 Collector 노드 = 앱 노드).
          # hostmetrics처럼 리소스 속성이 없는 데이터도 노드를 구분할 수 있다.
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      # OBS-3 (#3): 브라우저 데이터는 frontend-proxy 연결로 들어와 프록시 파드 정보가 붙는다.
      # 브라우저는 파드가 아니므로 쿠버네티스·호스트 관련 속성을 지운다.
      # 브라우저 스팬에서 만든 span metrics도 metrics 파이프라인의 resource를 지나며 host.name이 다시 붙으므로
      # 같은 처리를 메트릭에도 적용한다.
      transform/browser_resource:
        error_mode: ignore
        trace_statements: &browserResourceStatements
          - context: resource
            statements:
              - delete_matching_keys(attributes, "^(k8s|container)\\..*") where attributes["service.name"] == "frontend-web"
              - delete_key(attributes, "host.name") where attributes["service.name"] == "frontend-web"
              - delete_key(attributes, "service.instance.id") where attributes["service.name"] == "frontend-web"
        metric_statements: *browserResourceStatements
    service:
      pipelines:
        traces:
          # 차트 기본 순서에 추가한 것:
          # - transform/drop_sdk_container_id: k8s_attributes 앞 (OBS-2)
          # - transform/browser_resource: resource 뒤에 둬야 host.name 등이 다시 붙지 않는다 (OBS-3)
          processors:
            - transform/drop_sdk_container_id
            - k8s_attributes
            - memory_limiter
            - resource_detection
            - resource
            - transform/browser_resource
            - transform/sanitize_spans
            - gen_ai_normalizer
            - transform/redact_sensitive_data
            - redaction
        metrics:
          # 차트 기본 otlp_http/prometheus(내장 Prometheus)를 otlp_http/kps로 교체
          exporters:
            - otlp_http/kps
            - debug
          # 차트 기본 순서에 transform/drop_sdk_container_id(OBS-2),
          # transform/browser_resource(span_metrics로 만든 브라우저 메트릭 처리, OBS-3) 추가
          processors:
            - transform/drop_sdk_container_id
            - k8s_attributes
            - memory_limiter
            - resource_detection
            - resource
            - transform/browser_resource
        logs:
          # 차트 기본 순서에 transform/drop_sdk_container_id만 추가 (OBS-2, 앱 로그도 같은 문제)
          processors:
            - transform/drop_sdk_container_id
            - k8s_attributes
            - memory_limiter
            - resource_detection
            - resource
            - transform/sanitize_logs

# 관측 도구는 monitoring 노드그룹 전용 taint를 견디고 그 노드로만 간다.
# 같은 규칙을 아래 하위 차트에서 YAML 앵커로 재사용한다.
jaeger:
  jaeger: &monitoringNode
    nodeSelector:
      role: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule
    # 차트 기본 목록에서 PROMETHEUS_ADDR만 kube-prometheus-stack으로 변경 (Jaeger Monitor 탭이 span metrics를 조회)
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "25000"
      - name: PROMETHEUS_ADDR
        value: kps-prometheus.monitoring:9090
      - name: OTEL_COLLECTOR_HOST
        value: otel-collector
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"

# Phase 3-B ④: kube-prometheus-stack(monitoring 네임스페이스)의 Prometheus·Grafana로 대체
prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  <<: *monitoringNode
